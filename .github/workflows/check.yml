name: Project checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GOTOOLCHAIN: local
      GOPROXY: off
      GOSUMDB: off
      GOFLAGS: -mod=vendor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: go run ./tools/project check
      - if: runner.os == 'Linux'
        run: go test -race -count=1 ./...
      - if: runner.os == 'Linux'
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -trimpath -o ${{ runner.temp }}/ExcelLens.exe ./cmd/excellens
